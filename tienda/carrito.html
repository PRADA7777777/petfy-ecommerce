<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Petfy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/petfy.css">
    <style>
        .cart-page { padding: 2rem 0 4rem; min-height: 60vh; }
        .cart-page h1 { font-size: 2rem; font-weight: 800; color: var(--dark); margin-bottom: 2rem; }
        .cart-table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
        .cart-table th { background: var(--gray-100); padding: 1rem; text-align: left; font-weight: 700; color: var(--gray-700); }
        .cart-table td { padding: 1rem; border-bottom: 1px solid var(--gray-100); }
        .cart-table img { width: 60px; height: 60px; object-fit: cover; border-radius: var(--radius-sm); }
        .cart-empty { text-align: center; padding: 4rem; }
        .cart-empty i { font-size: 4rem; color: var(--gray-300); margin-bottom: 1rem; display: block; }
        .cart-summary { background: var(--white); border-radius: var(--radius-lg); padding: 2rem; box-shadow: var(--shadow); margin-top: 2rem; }
        .cart-summary h3 { margin-bottom: 1rem; }
        .cart-total { font-size: 1.5rem; font-weight: 800; color: var(--dark); }
        .btn-checkout { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-weight: 700; font-size: 1.1rem; cursor: pointer; margin-top: 1rem; font-family: inherit; transition: var(--transition); }
        .btn-checkout:hover { background: var(--primary-dark); }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo"><a href="../index.html"><img src="../assets/img/petfy.png" alt="Petfy"></a></div>
                <ul class="nav-links">
                    <li class="nav-item dropdown-trigger"><a href="../tienda/index.html" class="nav-link active">Tienda <i class="fas fa-chevron-down dropdown-arrow"></i></a></li>
                    <li class="nav-item"><a href="../servicios/index.html" class="nav-link">Servicios</a></li>
                    <li class="nav-item"><a href="../contacto/index.html" class="nav-link">Contacto</a></li>
                </ul>
                <div class="user-actions">
                    <a href="carrito.html" class="icon-link cart-icon"><i class="fas fa-shopping-cart"></i><span class="cart-count">0</span></a>
                </div>
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
            </nav>
        </div>
    </header>

    <div class="breadcrumb-wrapper"><div class="container"><nav class="breadcrumb"><ol class="breadcrumb-list" id="breadcrumbList"></ol></nav></div></div>

    <main class="cart-page">
        <div class="container">
            <h1><i class="fas fa-shopping-cart"></i> Tu Carrito</h1>
            <div id="cartContainer">
                <table class="cart-table">
                    <thead><tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Total</th><th></th></tr></thead>
                    <tbody id="cartItems"></tbody>
                </table>
                <div class="cart-summary">
                    <h3>Resumen del Pedido</h3>
                    <div class="cart-total" id="cartTotal">Total: $0</div>
                    <button class="btn-checkout" onclick="irACheckout()"><i class="fas fa-lock"></i> Proceder al Pago</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2024 Petfy.</p></div></div></footer>

    <script src="../assets/js/main.js"></script>
    <script>
        function cargarCarrito() {
            const cart = JSON.parse(localStorage.getItem('petfyCart')) || [];
            const tbody = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');
            
            if (cart.length === 0) {
                document.getElementById('cartContainer').innerHTML = '<div class="cart-empty"><i class="fas fa-shopping-cart"></i><p>Tu carrito está vacío</p><a href="index.html" class="btn btn-primary mt-4">Ir a la Tienda</a></div>';
                return;
            }
            
            let total = 0;
            tbody.innerHTML = '';
            cart.forEach((item, i) => {
                const price = parseFloat(item.price.replace(/[^0-9.-]+/g,'')) || 0;
                const subtotal = price * item.quantity;
                total += subtotal;
                tbody.innerHTML += `<tr>
                    <td><div style="display:flex;align-items:center;gap:1rem"><img src="${item.image}" alt="${item.name}" onerror="this.src='../assets/img/placeholder.png'"><span>${item.name}</span></div></td>
                    <td>${item.price}</td>
                    <td><input type="number" value="${item.quantity}" min="1" style="width:60px;padding:0.5rem;border:1px solid var(--gray-200);border-radius:4px" onchange="actualizarCantidad(${i},this.value)"></td>
                    <td><strong>$${subtotal.toFixed(0)}</strong></td>
                    <td><button onclick="eliminarItem(${i})" style="background:none;border:none;color:var(--danger);cursor:pointer"><i class="fas fa-trash"></i></button></td>
                </tr>`;
            });
            totalEl.textContent = `Total: $${total.toFixed(0)}`;
        }
        function actualizarCantidad(i, qty) {
            const cart = JSON.parse(localStorage.getItem('petfyCart')) || [];
            cart[i].quantity = Math.max(1, parseInt(qty) || 1);
            localStorage.setItem('petfyCart', JSON.stringify(cart));
            cargarCarrito();
        }
        function eliminarItem(i) {
            const cart = JSON.parse(localStorage.getItem('petfyCart')) || [];
            cart.splice(i, 1);
            localStorage.setItem('petfyCart', JSON.stringify(cart));
            cargarCarrito();
        }
        function irACheckout() {
            const cart = JSON.parse(localStorage.getItem('petfyCart')) || [];
            if (cart.length === 0) { alert('Agrega productos primero'); return; }
            window.location.href = 'checkout.html';
        }
        cargarCarrito();
    </script>
</body>
</html>
