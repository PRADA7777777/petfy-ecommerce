<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos - Petfy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/petfy.css">
    <style>
        .wishlist-page { padding: 2rem 0 4rem; min-height: 60vh; }
        .wishlist-page h1 { font-size: 2rem; font-weight: 800; margin-bottom: 2rem; }
        .wishlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
        .wishlist-empty { text-align: center; padding: 4rem; color: var(--gray-500); }
        .wishlist-empty i { font-size: 4rem; color: var(--gray-300); display: block; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo"><a href="../index.html"><img src="../assets/img/petfy.png" alt="Petfy"></a></div>
                <ul class="nav-links">
                    <li class="nav-item dropdown-trigger"><a href="../tienda/index.html" class="nav-link active">Tienda <i class="fas fa-chevron-down dropdown-arrow"></i></a></li>
                    <li class="nav-item"><a href="../servicios/index.html" class="nav-link">Servicios</a></li>
                    <li class="nav-item"><a href="../contacto/index.html" class="nav-link">Contacto</a></li>
                </ul>
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
            </nav>
        </div>
    </header>

    <div class="breadcrumb-wrapper"><div class="container"><nav class="breadcrumb"><ol class="breadcrumb-list" id="breadcrumbList"></ol></nav></div></div>

    <main class="wishlist-page">
        <div class="container">
            <h1><i class="fas fa-heart" style="color:var(--danger)"></i> Mis Favoritos</h1>
            <div class="wishlist-grid" id="wishlistGrid">
                <div class="wishlist-empty">
                    <i class="fas fa-heart-broken"></i>
                    <p>No tienes productos favoritos</p>
                    <a href="index.html" class="btn btn-primary mt-4">Explorar Tienda</a>
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/js/main.js"></script>
    <script>
        const favs = JSON.parse(localStorage.getItem('petfyFavs')) || [];
        if (favs.length > 0) {
            document.getElementById('wishlistGrid').innerHTML = '<p>Productos guardados: ' + favs.length + '</p>';
        }
    </script>
</body>
</html>
