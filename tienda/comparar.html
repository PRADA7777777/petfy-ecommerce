<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar Productos - Petfy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/petfy.css">
    <style>
        .comparar-page { padding: 2rem 0 4rem; min-height: 60vh; }
        .comparar-page h1 { font-size: 2rem; font-weight: 800; margin-bottom: 2rem; }
        .comparar-empty { text-align: center; padding: 4rem; color: var(--gray-500); }
        .comparar-empty i { font-size: 4rem; color: var(--gray-300); display: block; margin-bottom: 1rem; }
        .comparar-table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
        .comparar-table th, .comparar-table td { padding: 1rem; text-align: center; border: 1px solid var(--gray-200); }
        .comparar-table th { background: var(--gray-100); font-weight: 700; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo"><a href="../index.html"><img src="../assets/img/petfy.png" alt="Petfy"></a></div>
                <ul class="nav-links">
                    <li class="nav-item dropdown-trigger"><a href="../tienda/index.html" class="nav-link active">Tienda <i class="fas fa-chevron-down dropdown-arrow"></i></a></li>
                    <li class="nav-item"><a href="../servicios/index.html" class="nav-link">Servicios</a></li>
                    <li class="nav-item"><a href="../contacto/index.html" class="nav-link">Contacto</a></li>
                </ul>
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
            </nav>
        </div>
    </header>

    <main class="comparar-page">
        <div class="container">
            <h1><i class="fas fa-balance-scale"></i> Comparar Productos</h1>
            <div class="comparar-empty">
                <i class="fas fa-box-open"></i>
                <p>Agrega productos para comparar</p>
                <a href="index.html" class="btn btn-primary mt-4">Ir a la Tienda</a>
            </div>
        </div>
    </main>
</body>
</html>
