<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado - Petfy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/petfy.css">
    <style>
        .confirmacion-page { padding: 4rem 0; min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .confirmacion-card { background: var(--white); border-radius: var(--radius-lg); padding: 3rem; box-shadow: var(--shadow-lg); max-width: 500px; width: 100%; }
        .confirmacion-icon { font-size: 5rem; color: var(--success); margin-bottom: 1.5rem; animation: bounceIn 0.6s ease; }
        .confirmacion-card h1 { font-size: 2rem; font-weight: 800; color: var(--dark); margin-bottom: 0.5rem; }
        .confirmacion-card p { color: var(--gray-600); margin-bottom: 1.5rem; }
        .order-number { background: var(--gray-100); padding: 1rem; border-radius: var(--radius); font-size: 1.2rem; font-weight: 700; color: var(--dark); margin-bottom: 1.5rem; }
        .btn-volver { display: inline-block; padding: 0.875rem 2rem; background: var(--primary); color: white; text-decoration: none; border-radius: var(--radius-full); font-weight: 600; transition: var(--transition); }
        .btn-volver:hover { background: var(--primary-dark); transform: translateY(-2px); }
        @keyframes bounceIn { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo"><a href="../index.html"><img src="../assets/img/petfy.png" alt="Petfy"></a></div>
                <ul class="nav-links">
                    <li class="nav-item"><a href="../tienda/index.html" class="nav-link">Tienda</a></li>
                    <li class="nav-item"><a href="../servicios/index.html" class="nav-link">Servicios</a></li>
                    <li class="nav-item"><a href="../contacto/index.html" class="nav-link">Contacto</a></li>
                </ul>
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
            </nav>
        </div>
    </header>

    <main class="confirmacion-page">
        <div class="container">
            <div class="confirmacion-card">
                <div class="confirmacion-icon"><i class="fas fa-check-circle"></i></div>
                <h1>¡Pedido Confirmado!</h1>
                <p>Gracias por tu compra. Te enviaremos un email con los detalles.</p>
                <div class="order-number">Pedido #<span id="orderNumber">---</span></div>
                <a href="../index.html" class="btn-volver"><i class="fas fa-home"></i> Volver al Inicio</a>
            </div>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const order = params.get('order') || Date.now();
        document.getElementById('orderNumber').textContent = order.toString().slice(-8);
    </script>
</body>
</html>
