<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabaja con Nosotros - Petfy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/petfy.css">
    <style>
        .trabaja-page { padding: 2rem 0 4rem; text-align: center; }
        .trabaja-page h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; }
        .trabaja-card { background: var(--white); border-radius: var(--radius-lg); padding: 3rem; max-width: 600px; margin: 2rem auto; box-shadow: var(--shadow); }
        .trabaja-card i { font-size: 4rem; color: var(--primary); margin-bottom: 1rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo"><a href="../index.html"><img src="../assets/img/petfy.png" alt="Petfy"></a></div>
                <ul class="nav-links">
                    <li class="nav-item"><a href="../tienda/" class="nav-link">Tienda</a></li>
                    <li class="nav-item"><a href="../servicios/" class="nav-link">Servicios</a></li>
                    <li class="nav-item"><a href="../contacto/" class="nav-link">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="trabaja-page">
        <div class="container">
            <h1>Trabaja con Nosotros</h1>
            <div class="trabaja-card">
                <i class="fas fa-briefcase"></i>
                <h2>¿Quieres ser parte de Petfy?</h2>
                <p style="color:var(--gray-500);margin:1rem 0">Envíanos tu hoja de vida y cuéntanos por qué te gustaría trabajar con nosotros.</p>
                <a href="mailto:talento@petfy.com" class="btn btn-primary"><i class="fas fa-envelope"></i> talento@petfy.com</a>
            </div>
        </div>
    </footer>
</body>
</html>
