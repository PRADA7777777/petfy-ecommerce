<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipo - Petfy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/petfy.css">
    <style>
        .equipo-page { padding: 2rem 0 4rem; }
        .equipo-page h1 { text-align: center; font-size: 2.5rem; font-weight: 800; margin-bottom: 2rem; }
        .equipo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; }
        .equipo-card { background: var(--white); border-radius: var(--radius-lg); padding: 2rem; text-align: center; border: 1px solid var(--gray-200); transition: var(--transition); }
        .equipo-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-5px); }
        .equipo-avatar { width: 100px; height: 100px; background: var(--primary-light); border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--primary); }
        .equipo-card h3 { font-weight: 700; }
        .equipo-card span { color: var(--primary); font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo"><a href="../index.html"><img src="../assets/img/petfy.png" alt="Petfy"></a></div>
                <ul class="nav-links">
                    <li class="nav-item"><a href="../tienda/" class="nav-link">Tienda</a></li>
                    <li class="nav-item"><a href="../servicios/" class="nav-link">Servicios</a></li>
                    <li class="nav-item"><a href="../contacto/" class="nav-link">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="equipo-page">
        <div class="container">
            <h1>Nuestro Equipo</h1>
            <div class="equipo-grid">
                <div class="equipo-card"><div class="equipo-avatar"><i class="fas fa-user-tie"></i></div><h3>CEO</h3><span>Dirección General</span></div>
                <div class="equipo-card"><div class="equipo-avatar"><i class="fas fa-laptop-code"></i></div><h3>CTO</h3><span>Tecnología</span></div>
                <div class="equipo-card"><div class="equipo-avatar"><i class="fas fa-bullhorn"></i></div><h3>CMO</h3><span>Marketing</span></div>
                <div class="equipo-card"><div class="equipo-avatar"><i class="fas fa-headset"></i></div><h3>Soporte</h3><span>Atención al Cliente</span></div>
            </div>
        </div>
    </main>
</body>
</html>
