<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Petfy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/petfy.css">
    <style>
        .blog-page { padding: 2rem 0 4rem; }
        .blog-page h1 { font-size: 2.5rem; font-weight: 800; text-align: center; margin-bottom: 2rem; }
        .blog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        .blog-card { background: var(--white); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); }
        .blog-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-5px); }
        .blog-card img { width: 100%; height: 200px; object-fit: cover; }
        .blog-card-body { padding: 1.5rem; }
        .blog-card-body h3 { font-weight: 700; margin-bottom: 0.5rem; }
        .blog-card-body p { color: var(--gray-500); font-size: 0.9rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo"><a href="../index.html"><img src="../assets/img/petfy.png" alt="Petfy"></a></div>
                <ul class="nav-links">
                    <li class="nav-item"><a href="../tienda/" class="nav-link">Tienda</a></li>
                    <li class="nav-item"><a href="../servicios/" class="nav-link">Servicios</a></li>
                    <li class="nav-item"><a href="../contacto/" class="nav-link">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="blog-page">
        <div class="container">
            <h1>Blog Petfy</h1>
            <div class="blog-grid">
                <article class="blog-card">
                    <img src="../assets/img/placeholder.png" alt="Artículo">
                    <div class="blog-card-body"><h3>Tips de alimentación</h3><p>Descubre la mejor dieta para tu mascota.</p></div>
                </article>
                <article class="blog-card">
                    <img src="../assets/img/placeholder.png" alt="Artículo">
                    <div class="blog-card-body"><h3>Cuidados en verano</h3><p>Protege a tu peludo del calor.</p></div>
                </article>
            </div>
        </div>
    </main>

    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2024 Petfy.</p></div></div></footer>
</body>
</html>
