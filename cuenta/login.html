<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en tu cuenta de Petfy">
    <title>Iniciar Sesión - Petfy</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/petfy.css">
    
    <style>
        .auth-page { display: flex; align-items: center; justify-content: center; min-height: 80vh; padding: 2rem; background: var(--gray-100); }
        .auth-card { background: var(--white); border-radius: var(--radius-lg); padding: 2.5rem; max-width: 420px; width: 100%; box-shadow: var(--shadow-lg); }
        .auth-card h1 { font-size: 1.8rem; font-weight: 800; text-align: center; margin-bottom: 0.5rem; color: var(--dark); }
        .auth-card .subtitle { text-align: center; color: var(--gray-500); margin-bottom: 2rem; font-size: 0.9rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-weight: 600; color: var(--gray-700); margin-bottom: 0.4rem; font-size: 0.85rem; }
        .form-group input { width: 100%; padding: 0.85rem 1rem; border: 2px solid var(--gray-200); border-radius: var(--radius); font-family: inherit; font-size: 0.95rem; transition: var(--transition); }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem; }
        .form-options a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .btn-auth { width: 100%; padding: 0.9rem; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-weight: 700; font-size: 1rem; cursor: pointer; font-family: inherit; transition: var(--transition); }
        .btn-auth:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--gray-500); }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .divider { display: flex; align-items: center; margin: 1.5rem 0; color: var(--gray-400); font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid var(--gray-200); }
        .divider span { margin: 0 1rem; }
        .btn-social { width: 100%; padding: 0.75rem; border: 2px solid var(--gray-200); border-radius: var(--radius); background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-family: inherit; font-weight: 600; font-size: 0.9rem; transition: var(--transition); margin-bottom: 0.5rem; }
        .btn-social:hover { background: var(--gray-50); border-color: var(--gray-300); }
    </style>
</head>
<body>
    
    <!-- ========== HEADER ========== -->
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo"><a href="../index.html"><img src="../assets/img/petfy.png" alt="Petfy"></a></div>
                <ul class="nav-links">
                    <li class="nav-item dropdown-trigger"><a href="../tienda/index.html" class="nav-link">Tienda <i class="fas fa-chevron-down dropdown-arrow"></i></a></li>
                    <li class="nav-item"><a href="../servicios/index.html" class="nav-link">Servicios</a></li>
                    <li class="nav-item"><a href="../contacto/index.html" class="nav-link">Contacto</a></li>
                </ul>
                <div class="nav-actions">
                    <a href="../tienda/carrito.html" class="icon-link cart-icon" title="Carrito"><i class="fas fa-shopping-cart"></i><span class="cart-count">0</span></a>
                </div>
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
            </nav>
        </div>
    </header>

    <!-- ========== BREADCRUMB ========== -->
    <div class="breadcrumb-wrapper"><div class="container"><nav class="breadcrumb"><ol class="breadcrumb-list" id="breadcrumbList"></ol></nav></div></div>

    <!-- ========== FORMULARIO ========== -->
    <main class="auth-page">
        <div class="auth-card">
            <h1>Iniciar Sesión</h1>
            <p class="subtitle">Bienvenido de vuelta a Petfy</p>
            
            <form onsubmit="return login(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <div class="form-options">
                    <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;"><input type="checkbox"> Recordarme</label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn-auth">Iniciar Sesión</button>
            </form>
            
            <div class="divider"><span>o continúa con</span></div>
            
            <button class="btn-social" onclick="alert('Google login')"><i class="fab fa-google" style="color:#DB4437;"></i> Google</button>
            <button class="btn-social" onclick="alert('Facebook login')"><i class="fab fa-facebook" style="color:#1877F2;"></i> Facebook</button>
            
            <p class="auth-footer">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
        </div>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col"><img src="../assets/img/petfy.png" alt="Petfy" class="footer-logo"><p>Tu tienda de confianza.</p></div>
                <div class="footer-col"><h4>Cuenta</h4><ul><li><a href="login.html">Iniciar Sesión</a></li><li><a href="registro.html">Crear Cuenta</a></li></ul></div>
            </div>
            <div class="footer-bottom"><p>&copy; 2024 Petfy.</p></div>
        </div>
    </footer>

    <script src="../assets/js/main.js"></script>
    <script>
        function login(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            if (!email) return false;
            alert('✅ Bienvenido ' + email);
            return false;
        }
    </script>
</body>
</html>
