<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Petfy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/petfy.css">
    <style>
        body { background: #F4EBE2; font-family: 'Nunito', sans-serif; margin: 0; }
        .auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
        .auth-card { background: white; border-radius: 30px; padding: 2.5rem; max-width: 400px; width: 100%; box-shadow: 0 15px 40px rgba(0,0,0,0.08); }
        .auth-card h1 { font-family: 'Fredoka One', cursive; text-align: center; color: #1F1B24; margin-bottom: 0.5rem; }
        .auth-card .sub { text-align: center; color: #6B7280; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-weight: 700; color: #1F1B24; margin-bottom: 0.3rem; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.85rem; border: 2px solid #E5E7EB; border-radius: 15px; font-family: 'Nunito', sans-serif; font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: #E0633F; }
        .btn { width: 100%; padding: 0.9rem; background: #E0633F; color: white; border: none; border-radius: 50px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; cursor: pointer; }
        .btn:hover { background: #C94E2E; }
        .error { color: #EF4444; text-align: center; margin-top: 0.5rem; display: none; }
        .footer-text { text-align: center; margin-top: 1.5rem; color: #6B7280; }
        .footer-text a { color: #E0633F; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <main class="auth-page">
        <div class="auth-card">
            <h1>🐾 Iniciar Sesión</h1>
            <p class="sub">Bienvenido de vuelta a Petfy</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Iniciar Sesión</button>
                <p class="error" id="errorMsg">Credenciales incorrectas</p>
            </form>
            <p class="footer-text">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            // Validación simple: cualquier email + contraseña de 4+ caracteres
            if (email && password.length >= 4) {
                // Guardar sesión
                const usuario = {
                    nombre: email.split('@')[0],
                    email: email,
                    telefono: ''
                };
                localStorage.setItem('petfyUser', JSON.stringify(usuario));
                localStorage.setItem('petfyLogged', 'true');
                
                // Redirigir al perfil
                window.location.href = 'perfil.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
