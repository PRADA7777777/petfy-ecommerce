<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Petfy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/petfy.css">
    <style>
        .perfil-page { padding: 2rem 0 4rem; min-height: 70vh; }
        .perfil-page h1 { font-size: 2rem; font-weight: 800; margin-bottom: 2rem; }
        .perfil-grid { display: grid; grid-template-columns: 250px 1fr; gap: 2rem; }
        .perfil-sidebar { background: var(--white); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow); }
        .perfil-sidebar a { display: block; padding: 0.75rem 1rem; border-radius: var(--radius-sm); text-decoration: none; color: var(--gray-700); font-weight: 500; transition: var(--transition); margin-bottom: 0.25rem; }
        .perfil-sidebar a:hover, .perfil-sidebar a.active { background: var(--primary-light); color: var(--primary); }
        .perfil-content { background: var(--white); border-radius: var(--radius-lg); padding: 2rem; box-shadow: var(--shadow); }
        @media (max-width: 768px) { .perfil-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo"><a href="../index.html"><img src="../assets/img/petfy.png" alt="Petfy"></a></div>
                <ul class="nav-links">
                    <li class="nav-item dropdown-trigger"><a href="../tienda/index.html" class="nav-link">Tienda <i class="fas fa-chevron-down dropdown-arrow"></i></a></li>
                    <li class="nav-item"><a href="../servicios/index.html" class="nav-link">Servicios</a></li>
                    <li class="nav-item"><a href="../contacto/index.html" class="nav-link">Contacto</a></li>
                </ul>
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
            </nav>
        </div>
    </header>

    <div class="breadcrumb-wrapper"><div class="container"><nav class="breadcrumb"><ol class="breadcrumb-list" id="breadcrumbList"></ol></nav></div></div>

    <main class="perfil-page">
        <div class="container">
            <h1><i class="fas fa-user-circle"></i> Mi Perfil</h1>
            <div class="perfil-grid">
                <aside class="perfil-sidebar">
                    <a href="perfil.html" class="active"><i class="fas fa-user"></i> Información Personal</a>
                    <a href="pedidos.html"><i class="fas fa-receipt"></i> Mis Pedidos</a>
                    <a href="direcciones.html"><i class="fas fa-map-marked-alt"></i> Direcciones</a>
                    <a href="../index.html" style="color:var(--danger);"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
                </aside>
                <div class="perfil-content">
                    <h3>Información Personal</h3>
                    <p style="color:var(--gray-500);">Nombre: Usuario Petfy</p>
                    <p style="color:var(--gray-500);">Email: usuario@petfy.com</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2024 Petfy.</p></div></div></footer>
    <script src="../assets/js/main.js"></script>
</body>
</html>
