<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardería - Petfy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/petfy.css">
    <style>
        .proximamente-page { display: flex; align-items: center; justify-content: center; min-height: 70vh; text-align: center; }
        .proximamente-card { background: var(--white); padding: 3rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); max-width: 500px; }
        .proximamente-icon { font-size: 5rem; margin-bottom: 1rem; }
        .proximamente-card h1 { font-size: 2rem; font-weight: 800; color: var(--dark); }
        .proximamente-card p { color: var(--gray-500); margin: 1rem 0; }
        .proximamente-card input { width: 100%; padding: 0.75rem; border: 2px solid var(--gray-200); border-radius: var(--radius); font-family: inherit; margin-bottom: 0.5rem; }
        .proximamente-card button { width: 100%; padding: 0.75rem; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-weight: 700; cursor: pointer; font-family: inherit; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo"><a href="../index.html"><img src="../assets/img/petfy.png" alt="Petfy"></a></div>
                <ul class="nav-links">
                    <li class="nav-item"><a href="../tienda/" class="nav-link">Tienda</a></li>
                    <li class="nav-item"><a href="index.html" class="nav-link active">Servicios</a></li>
                    <li class="nav-item"><a href="../contacto/" class="nav-link">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="proximamente-page">
        <div class="container">
            <div class="proximamente-card">
                <div class="proximamente-icon">🏠</div>
                <h1>Guardería</h1>
                <p>Estamos preparando un espacio seguro y divertido para tu mascota. Déjanos tu email y te avisaremos cuando esté disponible.</p>
                <input type="email" placeholder="tu@email.com" id="email">
                <button onclick="notificar('Guardería')"><i class="fas fa-bell"></i> Avísame</button>
                <a href="index.html" style="display:block;margin-top:1rem;color:var(--gray-500);">← Volver a Servicios</a>
            </div>
        </div>
    </main>
    <script>
        function notificar(servicio) {
            const email = document.getElementById('email').value;
            if (!email) { alert('Ingresa tu email'); return; }
            alert('✅ Te notificaremos a ' + email + ' cuando ' + servicio + ' esté disponible.');
        }
    </script>
</body>
</html>
