<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación - Petfy | Servicio Agendado</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/petfy.css">
    <style>
        .confirmacion-page{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:2rem;background:var(--bg);}
        .confirmacion-card{background:white;border-radius:30px;padding:3rem 2.5rem;text-align:center;max-width:600px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.1);animation:fadeSlideUp 0.6s ease;}
        @keyframes fadeSlideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
        .confirmacion-icon{font-size:5rem;animation:bounceIn 0.6s ease 0.3s both;}
        @keyframes bounceIn{0%{transform:scale(0);}50%{transform:scale(1.2);}100%{transform:scale(1);}}
        .confirmacion-card h1{font-family:'Fredoka One',cursive;color:var(--text);font-size:1.8rem;}
        .detalle-box{background:#FAFAF8;border-radius:20px;padding:1.5rem;text-align:left;margin:1.5rem 0;}
        .detalle-box h3{font-family:'Fredoka One',cursive;color:var(--primary);margin-bottom:0.5rem;}
        .detalle-row{display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid #F0EBE5;}
        .detalle-row:last-child{border-bottom:none;}
        .total-box{background:var(--primary-light);padding:1rem;border-radius:15px;text-align:center;margin:1rem 0;}
        .total-box .precio{font-family:'Fredoka One',cursive;font-size:2rem;color:var(--primary);}
        .btn-group{display:flex;gap:1rem;flex-wrap:wrap;}
        .btn{flex:1;min-width:150px;padding:0.9rem;border-radius:30px;font-weight:800;text-decoration:none;text-align:center;}
        .btn-primary{background:var(--primary);color:white;}
        .btn-outline{border:2px solid var(--primary);color:var(--primary);background:white;}
        .btn-wa{background:#25D366;color:white;}
        @media(max-width:768px){.confirmacion-card{padding:2rem 1.5rem;}.btn-group{flex-direction:column;}}
    </style>
</head>
<body>
    <header class="header"><div class="container"><nav class="navbar"><div class="logo"><a href="../index.html"><img src="../assets/img/petfy.png" alt="Petfy"></a></div></nav></div></header>
    
    <main class="confirmacion-page">
        <div class="confirmacion-card" id="confirmacionCard">
            <div class="confirmacion-icon">✅</div>
            <h1>¡Servicio Agendado!</h1>
            <p style="color:var(--text-light);">Tu paseo ha sido confirmado exitosamente</p>
            <div id="detallePedido"></div>
            <div class="btn-group">
                <a href="../index.html" class="btn btn-primary"><i class="fas fa-home"></i> Inicio</a>
                <a href="index.html" class="btn btn-outline"><i class="fas fa-calendar"></i> Agendar Otro</a>
                <a href="https://wa.me/573204829244" target="_blank" class="btn btn-wa" style="color:white;"><i class="fab fa-whatsapp"></i> Soporte</a>
            </div>
        </div>
    </main>
    
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2024 Petfy.</p></div></div></footer>
    
    <script>
        var pedido = JSON.parse(localStorage.getItem('petfyUltimoPedido') || '{}');
        var html = '';
        
        if (pedido.referencia) {
            html += '<div class="detalle-box">';
            html += '<h3>🐾 ' + pedido.plan_nombre + '</h3>';
            html += '<div class="detalle-row"><span>📋 Referencia:</span><strong>' + pedido.referencia + '</strong></div>';
            html += '<div class="detalle-row"><span>🐕 Mascota:</span><strong>' + pedido.mascota_nombre + '</strong></div>';
            html += '<div class="detalle-row"><span>📍 Dirección:</span><strong>' + pedido.servicio_direccion + '</strong></div>';
            html += '<div class="detalle-row"><span>📅 Inicio:</span><strong>' + pedido.servicio_fecha_inicio + '</strong></div>';
            html += '<div class="detalle-row"><span>⏰ Hora:</span><strong>' + pedido.servicio_hora + '</strong></div>';
            
            if (pedido.paseo_prueba) {
                html += '<div style="background:#ECFDF5;padding:1rem;border-radius:10px;margin:0.5rem 0;">';
                html += '<strong>🎁 Paseo de Prueba GRATIS</strong><br>';
                html += '📅 ' + pedido.paseo_prueba.fecha + ' ⏰ ' + pedido.paseo_prueba.hora;
                html += '</div>';
            }
            
            if (pedido.servicio_dias_semana && pedido.servicio_dias_semana.length > 0) {
                html += '<div class="detalle-row"><span>📆 Días:</span><strong>' + pedido.servicio_dias_semana.join(', ') + '</strong></div>';
            }
            
            if (pedido.facturacion && pedido.facturacion.fecha_proximo_pago) {
                html += '<div class="detalle-row"><span>💰 Próximo pago:</span><strong>' + pedido.facturacion.fecha_proximo_pago + '</strong></div>';
            }
            
            html += '</div>';
            
            html += '<div class="total-box">';
            html += '<p>Total pagado</p>';
            html += '<div class="precio">$' + pedido.plan_precio.toLocaleString() + '</div>';
            html += '<p style="font-size:0.8rem;">' + (pedido.facturacion && pedido.facturacion.frecuencia === 'mensual' ? 'Facturación mensual' : 'Pago único') + '</p>';
            html += '</div>';
        } else {
            html = '<p>No se encontró información del pedido.</p><a href="index.html" class="btn btn-primary">Agendar un Paseo</a>';
        }
        
        document.getElementById('detallePedido').innerHTML = html;
    </script>
</body>
</html>
